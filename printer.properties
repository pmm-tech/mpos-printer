#Printer
printer.port = 20001
printer.name = EPSON_L3250
printer.dpi = 72

#Paper 
#height if set 0, height will follow the document height
#orientation: 0 -> LANDSCAPE, 1 -> PORTRAIT
paper.width = 3.15
paper.height = 0
paper.orientation = 1
paper.margin.left = 0.1
paper.margin.right = 0.1
paper.margin.top = 0.15
paper.margin.bottom = 0.15

#Font
font.family = Courier
font.size = 8
#Line height
#font size -> line height
# 8pt ->10pt
# 9pt -> 12pt
# 10pt -> 13pt
# 11pt -> 14pt
font.line.height = 10

#ESC/P (e.g. EPSON LX-300 on continuous form) - raw byte printing, no Paper/page-height math.
#escp.printer.name must be an OS print queue configured as RAW passthrough
#(a CUPS raw queue on Linux/macOS, a Generic/Text-Only driver on a RAW-datatype port on Windows).
#Leave blank/unset until such a queue exists - the ESC/P backend fails loud rather than
#falling back to another printer.
escp.printer.name =
#escp.pitch: characters per inch, 10 (Pica) or 12 (Elite)
escp.pitch = 10
#escp.line.spacing: line spacing in n/180-inch units (ESC 3 n). 30 = 1/6" = standard 6 LPI.
escp.line.spacing = 30

